# Configuration for FLUX-schnell (proxy) / FLUX-dev (teacher) pair
# Inherits from default.yaml

defaults:
  - default

# Model family
model_family: flux

# Proxy: FLUX-schnell
proxy_steps: 4
proxy_guidance_scale: 0.0  # Schnell is distilled without CFG

# Teacher: FLUX-dev (per BFL model card)
teacher_steps: 50
guidance_scale: 3.5  # guidance embedding (single forward pass, replaces traditional CFG)
true_cfg_scale: 1.0  # disabled — FLUX-dev uses guidance embedding, not traditional CFG

# FLUX-specific latent shape is (1, 16, 128, 128) for 1024x1024

# Search settings optimized for FLUX
num_candidates: 256
top_k: 16
batch_size: 8  # Adjust based on GPU memory (FLUX is 12B params)

# Local refinement
local_refine: true
local_perturbations: 8
local_rounds: 4
local_epsilon: 0.1

# Teacher refinement
teacher_refine: true
refinement_strategy: same_noise

# Image size
image_size: 1024

# Model paths (fill in when available)
model_paths:
  proxy: null  # "black-forest-labs/FLUX.1-schnell"
  teacher: null  # "black-forest-labs/FLUX.1-dev"
